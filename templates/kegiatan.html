{% extends "base.html" %}
{% block content %}
<h2>Jadwal Kegiatan Donor</h2>
<table id="tbl"><thead><tr><th>Nama</th><th>Tanggal</th><th>Lokasi</th><th>Target</th><th></th></tr></thead><tbody></tbody></table>
<h3>Kegiatan Baru</h3>
<form id="f">
  <input name="nama" placeholder="Nama kegiatan" required>
  <input name="tanggal" type="date" required>
  <input name="lokasi" placeholder="Lokasi" required>
  <input name="target_peserta" type="number" min="0" placeholder="Target peserta">
  <button>Simpan</button>
</form>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const k = await api("/api/kegiatan");
  el("tbl").querySelector("tbody").innerHTML = k.map(x =>
    `<tr><td>${x.nama}</td><td>${x.tanggal}</td><td>${x.lokasi}</td><td>${x.target_peserta}</td>
     <td><button onclick="hapus(${x.id})" class="danger">Hapus</button></td></tr>`).join("");
}
el("f").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const r = await post("/api/kegiatan", d);
  if (!r.error) { e.target.reset(); load(); }
};
async function hapus(id) {
  if (!confirm("Hapus kegiatan?")) return;
  await fetch("/api/kegiatan/" + id, {method: "DELETE"});
  load();
}
load();
</script>
{% endblock %}
