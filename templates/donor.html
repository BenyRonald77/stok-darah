{% extends "base.html" %}
{% block content %}
<h2>Pendonor</h2>
<table id="tbl"><thead><tr><th>Nama</th><th>Golongan</th><th>Telepon</th><th>Donor Terakhir</th></tr></thead><tbody></tbody></table>
<h3>Tambah Pendonor</h3>
<form id="f">
  <input name="nama" placeholder="Nama" required>
  <select name="golongan" id="gol"></select>
  <select name="rhesus"><option>+</option><option>-</option></select>
  <input name="telepon" placeholder="Telepon">
  <button>Simpan</button>
</form>
<h3>Catat Donasi</h3>
<form id="d">
  <select name="pendonor_id" id="pd" required></select>
  <select name="komponen" id="komp" required></select>
  <input name="jumlah" type="number" min="1" value="1" required>
  <input name="tanggal" type="date">
  <button>Catat</button>
</form>
<h3>Pengingat: Sudah Boleh Donor Lagi</h3>
<table id="ingat"><thead><tr><th>Nama</th><th>Golongan</th><th>Telepon</th><th>Boleh Sejak</th></tr></thead><tbody></tbody></table>
{% endblock %}
{% block scripts %}
<script>
el("gol").innerHTML = GOLONGAN.map(g => `<option>${g}</option>`).join("");
el("komp").innerHTML = KOMPONEN.map(k => `<option>${k}</option>`).join("");
async function load() {
  const p = await api("/api/pendonor");
  el("pd").innerHTML = p.map(x => `<option value="${x.id}">${x.nama} (${x.golongan}${x.rhesus})</option>`).join("");
  el("tbl").querySelector("tbody").innerHTML = p.map(x =>
    `<tr><td>${x.nama}</td><td>${x.golongan}${x.rhesus}</td><td>${x.telepon || "-"}</td><td>${x.donor_terakhir || "-"}</td></tr>`).join("");
  const ing = await api("/api/pengingat");
  el("ingat").querySelector("tbody").innerHTML = ing.map(x =>
    `<tr><td>${x.nama}</td><td>${x.golongan}${x.rhesus}</td><td>${x.telepon || "-"}</td><td><b>${x.boleh_sejak}</b></td></tr>`).join("")
    || '<tr><td colspan="4">Belum ada yang eligible.</td></tr>';
}
el("f").onsubmit = async e => {
  e.preventDefault();
  const r = await post("/api/pendonor", Object.fromEntries(new FormData(e.target)));
  if (!r.error) { e.target.reset(); load(); }
};
el("d").onsubmit = async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  d.pendonor_id = +d.pendonor_id; d.jumlah = +d.jumlah;
  const r = await post("/api/donasi", d);
  if (!r.error) { alert("Donasi tercatat. Kedaluwarsa: " + r.tgl_kedaluwarsa); load(); }
};
load();
</script>
{% endblock %}
