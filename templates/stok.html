{% extends "base.html" %}
{% block content %}
<h2>Stok Kantong Darah</h2>
<table id="tbl"><thead><tr><th>Golongan</th><th>Komponen</th><th>Jumlah</th><th>Masuk</th><th>Kedaluwarsa</th><th>Status</th></tr></thead><tbody></tbody></table>
{% endblock %}
{% block scripts %}
<script>
(async () => {
  const s = await api("/api/stok");
  el("tbl").querySelector("tbody").innerHTML = s.map(x =>
    `<tr><td>${x.golongan}${x.rhesus}</td><td>${x.komponen}</td><td>${x.jumlah}</td>
     <td>${x.tgl_masuk}</td><td>${x.tgl_kedaluwarsa}</td>
     <td>${x.kedaluwarsa ? '<span class="badge merah">kedaluwarsa</span>' : x.hampir ? '<span class="badge kuning">≤ 7 hari</span>' : '<span class="badge hijau">aman</span>'}</td></tr>`).join("");
})();
</script>
{% endblock %}
